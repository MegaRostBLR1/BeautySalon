<main class="news-article" data-news-article>
    <section class="news-article__banner" aria-labelledby="news-article-title">
        <img class="news-article__banner-image" data-article-image alt="" width="1800" height="900" fetchpriority="high">
        <div class="news-article__banner-overlay"></div>
        <div class="news-article__banner-content">
            <span class="news-article__eyebrow">Новости и статьи салона</span>
            <h1 class="news-article__title" id="news-article-title" data-article-title></h1>
            <time class="news-article__date" data-article-date></time>
        </div>
    </section>
    <article class="news-article__content">
        <div class="news-article__body" data-article-body></div>
        <a class="news-article__back" href="#/home#news">← Вернуться к новостям</a>
    </article>
</main>
